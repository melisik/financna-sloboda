name: Publish app to public Pages repo

on:
  push:
    branches: [m1-domain, main]
  workflow_dispatch:

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Verejné repo dostane iba obsah dist/ (žiadne dokumenty, rozhodnutia ani review).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: melisik/financna-sloboda-app
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Nasadenie z financna-sloboda (${{ github.sha }})"
