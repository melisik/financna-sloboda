<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <!-- style-src 'unsafe-inline': appka používa inline štýly (atribút style); výnimka je zdokumentovaná v docs/22 (nález 17). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6b57" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2a25" media="(prefers-color-scheme: dark)" />
    <style>
      /* Farby appky (tmavý režim podľa systému, M6). Hodnoty sú v kóde ako premenné, nie priamo. */
      :root {
        color-scheme: light dark;
        --page: #f7f5f0;
        --surface: #ffffff;
        --surface-2: #f4f4f4;
        --banner: #f4f1e8;
        --ok-bg: #eef5f1;
        --err-bg: #fbe3e3;
        --warn-bg: #fff4e0;
        --text: #111111;
        --muted: #555555;
        --danger: #8a0000;
        --ok: #1b5e20;
        --border: #cccccc;
        --border-soft: #dddddd;
        --border-strong: #888888;
        --border-dashed: #aaaaaa;
        --primary-bg: #1f4e79;
        --primary-text: #ffffff;
        --video-bg: #000000;
        --focus: #1f4e79;
        --link: #1f4e79;
        --warn-border: #b7791f;
        --font-text: 1rem;
        --font-small: 0.9rem;
        --font-heading: 1.25rem;
        --font-title: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #15161a;
          --surface: #1f2026;
          --surface-2: #2a2c33;
          --banner: #2c2a22;
          --ok-bg: #1c2b23;
          --err-bg: #3a2121;
          --warn-bg: #3a3020;
          --text: #e8e8ea;
          --muted: #b9bcc4;
          --danger: #ff9b9b;
          --ok: #9ee0a6;
          --border: #4b4e57;
          --border-soft: #393c44;
          --border-strong: #7b7f8a;
          --border-dashed: #6a6e78;
          --primary-bg: #8ab4f8;
          --primary-text: #0b1620;
          --focus: #8ab4f8;
          --link: #8ab4f8;
          --warn-border: #e0a526;
        }
      }
      :root[data-theme="dark"] {
        --page: #15161a;
        --surface: #1f2026;
        --surface-2: #2a2c33;
        --banner: #2c2a22;
        --ok-bg: #1c2b23;
        --err-bg: #3a2121;
        --warn-bg: #3a3020;
        --text: #e8e8ea;
        --muted: #b9bcc4;
        --danger: #ff9b9b;
        --ok: #9ee0a6;
        --border: #4b4e57;
        --border-soft: #393c44;
        --border-strong: #7b7f8a;
        --border-dashed: #6a6e78;
        --primary-bg: #8ab4f8;
        --primary-text: #0b1620;
        --focus: #8ab4f8;
        --link: #8ab4f8;
        --warn-border: #e0a526;
      }
      body { background: var(--page); color: var(--text); margin: 0; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      a { color: var(--link); }
      /* Riadok sekcií v menu (docs/40, variant C): na telefóne jeden riadok, ktorý sa posúva do strany; od 600 px sa zalomí. */
      /* Polia nikdy širšie ako stránka (napr. dátum pri širšom systémovom písme). */
      input, select, textarea { max-width: 100%; box-sizing: border-box; }
      /* Prvok posunutý do zobrazenia neskončí pod prilepeným pruhom Uložiť (D-287); horné odsadenie nastaví menu. */
      html { scroll-padding-bottom: 120px; }
      .nav-sections { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 6px 4px; }
      @media (min-width: 600px) { .nav-sections { flex-wrap: wrap; overflow-x: visible; } }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fin. sloboda" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Finančná sloboda (prototyp)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
